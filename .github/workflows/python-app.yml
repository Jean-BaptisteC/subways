# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python application

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - run: git clone -b clean_data https://codeberg.org/comaps/subways.git
    - uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    - name: Install dependencies for linters
      run: |
        python -m pip install --upgrade pip
        pip install flake8==6.0.0 black==23.1.0
    - name: Lint with flake8
      run: |
        flake8
    - name: Check with black
      run: |
        black --check --line-length 79 .
    - name: Test subways with unittest
      run: |
        PYTHONPATH=. python3 scripts/process_subways.py -c "João" -l validation.log -d Paris.yaml
    - name: Upload log
      uses: actions/upload-artifact@v4
      with:
          name: validation_log
          path: validation.log
